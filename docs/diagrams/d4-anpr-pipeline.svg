<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 536" width="1200" height="536">
<defs><marker id="m-video" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369A1"/></marker><marker id="m-meta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="m-alert" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="m-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="m-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="m-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="1200" height="536" fill="#FFFFFF"/>

<rect x="24" y="24" width="270" height="176" rx="10" fill="#E0F2FE" stroke="#0369A1" stroke-width="1.6"/>
<circle cx="50" cy="53" r="13" fill="#0369A1"/>
<text x="50" y="57.5" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
<text x="68" y="58" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#0F172A">Ingest</text>
<text x="38" y="78" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">RTSP over TCP · reconnect + backoff</text>
<text x="38" y="100" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">Hardware decode, software fallback</text>
<text x="38" y="122" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">All frames decoded, ~1.5× rate to BGR</text>
<text x="38" y="144" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">Frame-PTS timestamps, loop re-anchor</text>
<text x="38" y="166" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#0369A1">HW decode: +49% fps at 8 streams</text>
<rect x="318" y="24" width="270" height="176" rx="10" fill="#E0F2FE" stroke="#0369A1" stroke-width="1.6"/>
<circle cx="344" cy="53" r="13" fill="#0369A1"/>
<text x="344" y="57.5" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
<text x="362" y="58" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#0F172A">Sample</text>
<text x="332" y="78" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">Latest frame only — never a queue</text>
<text x="332" y="100" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">5 frames/s per camera target</text>
<text x="332" y="122" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">Slow analysis lowers rate, no lag</text>
<text x="332" y="144" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">Batch all due cameras together</text>
<text x="332" y="166" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#0369A1">stale frames skipped</text>
<rect x="612" y="24" width="270" height="176" rx="10" fill="#E0F2FE" stroke="#0369A1" stroke-width="1.6"/>
<circle cx="638" cy="53" r="13" fill="#0369A1"/>
<text x="638" y="57.5" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
<text x="656" y="58" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#0F172A">Detect</text>
<text x="626" y="78" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">YOLOv11n plates + text-line finder</text>
<text x="626" y="100" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">YOLO11n COCO: vehicles, people</text>
<text x="626" y="122" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">Same frames, one batch per model</text>
<text x="626" y="144" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">FP16 auto-off on GTX 16xx (NaN)</text>
<text x="626" y="166" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#0369A1">objects: ~15 ms / frame</text>
<rect x="906" y="24" width="270" height="176" rx="10" fill="#E0F2FE" stroke="#0369A1" stroke-width="1.6"/>
<circle cx="932" cy="53" r="13" fill="#0369A1"/>
<text x="932" y="57.5" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">4</text>
<text x="950" y="58" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#0F172A">Read (OCR)</text>
<text x="920" y="78" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">fast-plate-ocr CCT-XS v2</text>
<text x="920" y="100" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">10 slots — Indian plates fit</text>
<text x="920" y="122" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">One batched call per cycle</text>
<text x="920" y="144" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">Confidence = weakest character</text>
<text x="920" y="166" text-anchor="start" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700" fill="#0369A1">read: GI01ZZOOO1</text>
<rect x="24" y="256" width="368" height="176" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="1.6"/>
<circle cx="50" cy="285" r="13" fill="#047857"/>
<text x="50" y="289.5" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">5</text>
<text x="68" y="290" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#0F172A">Normalise</text>
<text x="38" y="310" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">Layouts: SS RR L(1–3) NNNN · BH series</text>
<text x="38" y="332" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">Position-aware O/0 · I/1 · B/8 repair</text>
<text x="38" y="354" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">Look-alike state codes: GI → GJ</text>
<text x="38" y="376" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">Reject non-plates (overlay text)</text>
<text x="38" y="398" text-anchor="start" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700" fill="#047857">→ GJ01ZZ0001</text>
<rect x="414" y="256" width="368" height="176" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="1.6"/>
<circle cx="440" cy="285" r="13" fill="#047857"/>
<text x="440" y="289.5" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">6</text>
<text x="458" y="290" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#0F172A">Track and vote</text>
<text x="428" y="310" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">Per-camera tracks · merge reads ≤ 2 edits apart</text>
<text x="428" y="332" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">Hold ≥ 1 s and ≥ 2.5 analysis intervals</text>
<text x="428" y="354" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">One-offs dropped; below 2 fps one read ≥ 0.6 kept</text>
<text x="428" y="376" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">Per-character vote · vehicle box: type, colour</text>
<text x="428" y="398" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">Repeat filter: 1-char variant = same vehicle</text>
<text x="428" y="420" text-anchor="start" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700" fill="#047857">GJ13WF8306 · white/silver car</text>
<rect x="804" y="256" width="368" height="176" rx="10" fill="#FFE4E6" stroke="#BE123C" stroke-width="1.6"/>
<circle cx="830" cy="285" r="13" fill="#BE123C"/>
<text x="830" y="289.5" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">7</text>
<text x="848" y="290" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#0F172A">Match and alert</text>
<text x="818" y="310" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">Store sighting (partitioned table)</text>
<text x="818" y="332" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">Watchlist: exact, else one character off</text>
<text x="818" y="354" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">Single-read sighting: exact match only</text>
<text x="818" y="376" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">120 s cooldown per entry per camera</text>
<text x="818" y="398" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">Push over WebSocket · crop attached</text>
<text x="818" y="420" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#DC2626">VAHAN stolen → HIGH alert</text>

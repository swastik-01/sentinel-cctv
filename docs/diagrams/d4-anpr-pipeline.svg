<path d="M782,344 L804,344" fill="none" stroke="#DC2626" stroke-width="2.2" marker-end="url(#m-alert)" stroke-linejoin="round"/>
<rect x="555.55" y="217.5" width="156.9" height="21" rx="4" fill="#FFFFFF" fill-opacity="0.94"/>
<text x="634" y="232.5" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="600" fill="#047857">plate candidates + text</text>
<text x="24" y="470" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#334155">Measured 24 Sep on a GTX 1650 Ti laptop, 4 cameras, 15 min: over 1,400 sightings, 31 watchlist alerts; first read → alert row median 1.06 s, p95 1.94 s.</text>
<text x="24" y="492" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#334155">Hardware decode (D3D11, the laptop's Intel iGPU, not NVDEC): +49% analysed fps per stream at 8 and 12 streams. Keeping frames on the GPU is production design.</text>
<text x="24" y="514" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#334155">API unreachable: batches spool to disk and replay in order with their frame times; hits on a cached watchlist are logged at the edge, alerted on replay.</text>
</svg>
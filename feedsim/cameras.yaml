# Simulated camera fleet. Mirrors the sandbox: multiple departments, mixed codecs,
# mixed resolutions, and a realistic split between cameras where plates are
# legible (anpr_viable) and wide-angle cameras where they are not.
#
# `scene` drives synth.py:  close | mid | wide | analog
# `plates` are the vehicles that pass through this camera's synthetic clip.
# The same plate appearing across several cameras is what makes the
# movement-history query meaningful.


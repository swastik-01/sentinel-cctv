  # --- Stock traffic footage (Pexels licence: free to use and modify) -------------------
  # synth.py's rectangles are invisible to a general object detector, so these two cameras
  # replay real traffic instead. realclip.py crops the source to the camera's view and
  # replaces every number plate it finds with a synthetic Gujarat registration (ground
  # truth in media/<CODE>.plates.json). The locations are simulated, like every camera here.
  # `analytics: true` asks for the analytics worker even where plates are not legible,
  # which is how a wide camera gets vehicle and person counts.
  - code: AMD-TRAF-001
    name: Ashram Road Junction, Ahmedabad (stock traffic footage)
    department: HOME
    district: Ahmedabad
    lat: 23.0469
    lon: 72.5680
    codec: h264
    resolution: 1920x1080
    fps: 25
    mode: ip_rtsp
    camera_class: ptz
    vendor: Axis
    retention_days: 30
    storage: local
    anpr_viable: false
    analytics: true
    real: {pexels_id: 30608914, crop: [0, 0, 3840, 2160], start: 0, seconds: 60, max_plate_frac: 0.04}

  - code: AMD-TRAF-002

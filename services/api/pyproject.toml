[project]
name = "sentinel-api"
version = "0.1.0"
description = "Sentinel registry, GIS, search, watchlist, alerting and RBAC API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "asyncpg>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "redis>=5.2",
  "httpx>=0.28",
  "pyjwt>=2.10",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.20",
  "sentinel-common",
]

[project.scripts]
sentinel-api = "sentinel_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel_api"]
